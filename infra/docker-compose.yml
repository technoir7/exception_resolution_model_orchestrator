version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ap_user
      POSTGRES_PASSWORD: ap_password
      POSTGRES_DB: ap_reconciliation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ap_user -d ap_reconciliation"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ap_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ap_network

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ap_user:ap_password@postgres:5432/ap_reconciliation
      DATABASE_URL_SYNC: postgresql://ap_user:ap_password@postgres:5432/ap_reconciliation
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET: dev-secret-change-in-production
      ENVIRONMENT: development
    volumes:
      - ../apps/api:/app/apps/api
      - ../fixtures:/app/fixtures
      - ../scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ap_network
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://ap_user:ap_password@postgres:5432/ap_reconciliation
      DATABASE_URL_SYNC: postgresql://ap_user:ap_password@postgres:5432/ap_reconciliation
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET: dev-secret-change-in-production
      ENVIRONMENT: development
    volumes:
      - ../apps/api:/app/apps/api
      - ../fixtures:/app/fixtures
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ap_network
    command: celery -A apps.api.tasks.celery_app worker --loglevel=info

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://api:8000
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - ap_network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  ap_network:
    driver: bridge
